  <body>
    <!-- Netlify reads this form when the site is uploaded; the page's own slip form (SupportSlip) posts to it. -->
    <form name="support-slip" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <textarea name="message"></textarea>
      <input name="slip" type="file" />
    </form>
    <form name="creator-note" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
